<script>
// --- CONFIGURACIÓN ---
const ADMIN_USER='admin2026'; const ADMIN_PASS='Mundial2026!';
window.GROUPS={'A':{teams:['México','Sudáfrica','Corea del Sur','Rep. Checa']},'B':{teams:['Canadá','Bosnia','Qatar','Suiza']},'C':{teams:['Brasil','Marruecos','Haití','Escocia']},'D':{teams:['USA','Paraguay','Australia','Turquía']},'E':{teams:['Alemania','Curazao','Costa de Marfil','Ecuador']},'F':{teams:['Países Bajos','Japón','Suecia','Túnez']},'G':{teams:['Bélgica','Egipto','Irán','Nueva Zelanda']},'H':{teams:['España','Cabo Verde','Arabia Saudita','Uruguay']},'I':{teams:['Francia','Senegal','Irak','Noruega']},'J':{teams:['Argentina','Argelia','Austria','Jordania']},'K':{teams:['Portugal','RD Congo','Uzbekistán','Colombia']},'L':{teams:['Inglaterra','Croacia','Ghana','Panamá']}};
const MATCHUPS_PER_GROUP=[[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];
const FLAGS={'México':'🇲🇽','Sudáfrica':'🇿🇦','Corea del Sur':'🇰🇷','Rep. Checa':'🇨🇿','Canadá':'🇨🇦','Bosnia':'🇧🇦','Qatar':'🇶🇦','Suiza':'🇨🇭','Brasil':'🇧🇷','Marruecos':'🇲🇦','Haití':'🇭🇹','Escocia':'🏴󠁧󠁢󠁳󠁣󠁴󠁿','USA':'🇺🇸','Paraguay':'🇵🇾','Australia':'🇦🇺','Turquía':'🇹🇷','Alemania':'🇩🇪','Curazao':'🇨🇼','Costa de Marfil':'🇨🇮','Ecuador':'🇪🇨','Países Bajos':'🇳🇱','Japón':'🇯🇵','Suecia':'🇸🇪','Túnez':'🇹🇳','Bélgica':'🇧🇪','Egipto':'🇪🇬','Irán':'🇮🇷','Nueva Zelanda':'🇳🇿','España':'🇪🇸','Cabo Verde':'🇨🇻','Arabia Saudita':'🇸🇦','Uruguay':'🇺🇾','Francia':'🇫🇷','Senegal':'🇸🇳','Irak':'🇮🇶','Noruega':'🇳🇴','Argentina':'🇦🇷','Argelia':'🇩🇿','Austria':'🇦🇹','Jordania':'🇯🇴','Portugal':'🇵🇹','RD Congo':'🇨🇩','Uzbekistán':'🇺🇿','Colombia':'🇨🇴','Inglaterra':'🏴󠁧󠁢󠁥󠁮󠁧󠁿','Croacia':'🇭🇷','Ghana':'🇬🇭','Panamá':'🇵🇦'};
const TOURNAMENT_DATES=[{day:11,month:6,label:'11 Jun'},{day:12,month:6,label:'12 Jun'},{day:13,month:6,label:'13 Jun'},{day:14,month:6,label:'14 Jun'},{day:15,month:6,label:'15 Jun'},{day:18,month:6,label:'18 Jun'},{day:19,month:6,label:'19 Jun'},{day:20,month:6,label:'20 Jun'},{day:24,month:6,label:'24 Jun'}];
const FIXTURE={
  A:[{m:[0,1],fecha:'11 Jun'},{m:[2,3],fecha:'11 Jun'},{m:[0,2],fecha:'18 Jun'},{m:[1,3],fecha:'18 Jun'},{m:[0,3],fecha:'24 Jun'},{m:[1,2],fecha:'24 Jun'}],
  B:[{m:[0,1],fecha:'12 Jun'},{m:[2,3],fecha:'13 Jun'},{m:[0,2],fecha:'18 Jun'}],
  E:[{m:[0,1],fecha:'14 Jun'},{m:[2,3],fecha:'14 Jun'}]
};
let RULES={soloGan:3,ganMarca:5,empate:4,empMarca:6,clasif:7,posEx:2,koGanador:5,koMarcador:3,gol:20};

// --- ESTADO LOCAL ---
let CU=null, IS_ADMIN=false;
let _cache={users:{},results:{},quinielas:{}};

// --- LÓGICA DINÁMICA DE PARTIDOS DEL DÍA ---
function getMatchesForDay(d, m) {
    const list = [];
    const dateStr = d + ' ' + (m === 6 ? 'Jun' : 'Jul');
    Object.entries(window.GROUPS).forEach(([g, gData]) => {
        const fx = FIXTURE[g] || [];
        fx.forEach((f) => {
            if (f.fecha === dateStr) {
                const i = MATCHUPS_PER_GROUP.findIndex(match => match[0] === f.m[0] && match[1] === f.m[1]);
                list.push({ group: g, matchIdx: i, teamA: gData.teams[f.m[0]], teamB: gData.teams[f.m[1]], scoreKey: g + '_' + i });
            }
        });
    });
    return list;
}

function getPredictionCellHtml(match, userName, results) {
    const q = _cache.quinielas[userName] || {scores:{}};
    const pick = q.scores[match.group] ? q.scores[match.group][match.matchIdx] : null;
    const real = results[match.scoreKey];
    let pickStr = '-';
    let colorStyle = 'background:var(--card3); color:var(--text3);';

    if (pick && pick.h !== '' && pick.a !== '') {
        pickStr = `${pick.h}-${pick.a}`;
        if (real && real.h !== undefined) {
            const pts = calcMatchPoints(real, pick);
            if (pts === RULES.ganMarca || pts === RULES.empMarca) colorStyle = 'background:#1acc5e; color:#000;'; // Verde
            else if (pts > 0) colorStyle = 'background:#ffb830; color:#000;'; // Amarillo
            else colorStyle = 'background:#ff4d6b; color:#fff;'; // Rojo
        }
    }

    return `<td style="padding:4px;"><div style="${colorStyle} border-radius:4px; font-weight:700; font-size:10px; width:42px; margin:0 auto; padding:5px 0; border:1px solid rgba(255,255,255,0.1);">${pickStr}</div></td>`;
}

// --- FUNCIONES CORE ---
function calcMatchPoints(real, pick) {
    if(!real || !pick || pick.h==='' || pick.a==='') return 0;
    const rh=parseInt(real.h), ra=parseInt(real.a), ph=parseInt(pick.h), pa=parseInt(pick.a);
    if(ph===rh && pa===ra) return (rh===ra) ? RULES.empMarca : RULES.ganMarca;
    const rr = rh>ra?1:rh<ra?-1:0, pr = ph>pa?1:ph<pa?-1:0;
    if(rr===pr) return (rr===0)?RULES.empate : RULES.soloGan;
    return 0;
}

window.nav = (id) => {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-'+id).classList.add('active');
    if(id==='ranking') window.buildRanking();
};

window.buildRanking = () => {
    const users = Object.entries(_cache.users).filter(([k,v])=>!v.isAdmin && v.approved).map(([k,v])=>({u:k, ...v})).sort((a,b)=>b.pts-a.pts);
    const d = window._selRankDay || 11;
    const matches = getMatchesForDay(d, 6);
    const res = _cache.results || {};

    let selectHtml = `<select class="mini-sel" style="width:auto;" onchange="window._selRankDay=parseInt(this.value); window.buildRanking()">`;
    TOURNAMENT_DATES.forEach(dt => selectHtml += `<option value="${dt.day}" ${dt.day===d?'selected':''}>${dt.label}</option>`);
    selectHtml += `</select>`;
    document.getElementById('rankingBtnGroup').innerHTML = selectHtml;

    let html = `<div class="gtable-wrap"><table class="gtable"><thead><tr style="background:var(--bg2);"><th>#</th><th style="text-align:left;">Jugador</th>`;
    
    // Columnas de partidos (Banderas + Resultado Real)
    matches.forEach(m => {
        const rs = res[m.scoreKey];
        const realStr = rs ? `${rs.h}-${rs.a}` : 'vs';
        html += `<th style="min-width:50px; border-left:1px solid var(--border);"><div style="font-size:16px; margin-bottom:2px;">${FLAGS[m.teamA]}${FLAGS[m.teamB]}</div><div style="font-size:9px; color:var(--green);">${realStr}</div></th>`;
    });

    html += `<th style="border-left:1px solid var(--border); color:var(--green);">Pts</th></tr></thead><tbody>`;

    if(users.length === 0) html += `<tr><td colspan="${3+matches.length}" class="empty">No hay datos</td></tr>`;

    users.forEach((u, i) => {
        html += `<tr>
            <td style="font-weight:700; color:var(--text3);">${i+1}</td>
            <td style="text-align:left; font-weight:600; font-size:11px;">${u.name}</td>`;
        matches.forEach(m => {
            html += getPredictionCellHtml(m, u.u, res);
        });
        html += `<td style="font-weight:700; color:var(--green); border-left:1px solid var(--border); font-family:'Bebas Neue'; font-size:16px;">${u.pts || 0}</td></tr>`;
    });

    html += `</tbody></table></div>`;
    document.getElementById('rankList').innerHTML = html;
    document.getElementById('rk-n').textContent = users.length;
    const myPos = users.findIndex(x=>x.u === CU);
    document.getElementById('rk-pos').textContent = myPos >= 0 ? '#' + (myPos + 1) : '#–';
};

// --- AUTH Y FIREBASE ---
window.doLogin = () => {
    const user = document.getElementById('lg-user').value.toLowerCase().trim();
    const pass = document.getElementById('lg-pass').value;
    if(user === ADMIN_USER && pass === ADMIN_PASS) { enterApp(user, true); }
    else if(_cache.users[user] && _cache.users[user].pass === pass) { enterApp(user, _cache.users[user].isAdmin); }
    else { alert('Credenciales incorrectas'); }
};

function enterApp(user, isAdmin) {
    CU = user; IS_ADMIN = isAdmin;
    document.getElementById('splash').classList.add('hide');
    document.getElementById('app').style.display = 'flex';
    document.getElementById('appHeader').style.display = 'block';
    document.getElementById('sidebarEl').style.display = 'block';
    document.getElementById('userAvatar').textContent = user.substring(0,2).toUpperCase();
    if(isAdmin) {
        document.getElementById('adminNavBtn').style.display = 'block';
        document.getElementById('adminSideBtn').style.display = 'block';
    }
    window.nav('ranking');
}

window.toast = (m) => { const e=document.getElementById('toast'); e.textContent=m; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),2500); };

document.addEventListener('firebase-ready', () => {
    const { _db, _fbRef, _fbOnValue } = window;
    _fbOnValue(_fbRef(_db, 'q26_users'), s => { if(s.exists()) _cache.users = s.val(); if(CU) window.buildRanking(); });
    _fbOnValue(_fbRef(_db, 'q26_results'), s => { if(s.exists()) _cache.results = s.val(); if(CU) window.buildRanking(); });
    _fbOnValue(_fbRef(_db, 'q26_q'), s => { if(s.exists()) _cache.quinielas = s.val(); if(CU) window.buildRanking(); });
    setTimeout(() => { document.getElementById('splash').classList.add('hide'); document.getElementById('app').style.display='flex'; }, 1500);
});

window.doLogout = () => location.reload();
</script>
